<html>
    <head>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    </head>   
<body>
<a-scene>
  <a-assets>
    <img id="texture" src="./asset/images/herbe.jpg">

    <a-mixin id="red" material="color: red"></a-mixin>
    <a-mixin id="blue" material="color: blue"></a-mixin>
    <a-mixin id="cube" geometry="primitive: box"></a-mixin>

</a-assets>

  <a-entity  position="-2 0 -4" mixin="red cube"></a-entity>
 
  <a-entity position="-3.5 0 -4" mixin="blue cube"></a-entity>
    <a-entity position="-0.5 0 -4" mixin="yellow cube"></a-entity>
</a-scene>

    </body>
</html>
